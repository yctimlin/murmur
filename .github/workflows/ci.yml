name: CI

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel and install it in a clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python -m venv /tmp/murmur-wheel
          /tmp/murmur-wheel/bin/pip install dist/*.whl pytest
          /tmp/murmur-wheel/bin/murmur --help
          /tmp/murmur-wheel/bin/python - <<'PY'
          from importlib.metadata import entry_points
          from importlib.resources import files

          scripts = {item.name: item.value for item in entry_points().select(group="console_scripts")}
          assert scripts["murmur"] == "murmur.cli:main", scripts
          for name in ("root.md", "peer.md", "closing.md", "solo.md"):
              text = files("murmur").joinpath("prompts", name).read_text()
              assert "attest" not in text, name
              assert text.strip(), name
          print("entry points and prompt resources ok")
          PY
          /tmp/murmur-wheel/bin/python -m pytest
