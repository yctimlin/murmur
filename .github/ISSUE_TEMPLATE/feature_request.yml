name: Feature request
description: Suggest a change to murmur.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, and how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other designs you considered.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: If the change is meant to make swarms faster, cheaper or better, any runs or data that support it (task, peers, model, how many runs).
